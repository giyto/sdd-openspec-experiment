schema: spec-driven

rules:
  proposal:
    - Публичный API, явно названный в задаче (модули, классы, функции, сигнатуры, порядок и вид параметров, поля, значения enum), переноси дословно. Не переименовывай и не перепроектируй его.
  specs:
    - Если задача задаёт имена и сигнатуры, требования и сценарии используют их без изменений.
  design:
    - Публичный API, заданный в задаче, не меняется. Внутреннее устройство выбирай сам.
  tasks:
    - Отдельной задачей в конце сверь публичный API реализации с proposal и specs.
